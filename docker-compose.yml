services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-gate-backend
    environment:
      - PORT=8000
      - SQLITE_DB_PATH=/app/data/smart_gate.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: smart-gate-proxy
    ports:
      - "${PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  smart_gate_data:
    name: smart_gate_data
    driver: local
