# Integrated Smart Hauling System -- development stack. One command brings up all four services.
#
#     docker compose up -d
#
#     core UI   http://localhost:3000     core API   http://localhost:8000
#     edge UI   http://localhost:3100     edge API   http://localhost:8100
#
# DEVELOPMENT ONLY, by explicit decision. In production these never share a
# machine: the edge pair runs on each of the 4 Jetsons (ARM64, via
# edge/backend/Dockerfile.jetson) and the core pair runs on a server. Splitting
# this into per-role compose files is deliberately deferred until the
# architecture settles.

name: smart-gate

services:
  # --- Core: collector, master registry, fleet-wide reporting ----------------
  core-backend:
    build:
      context: ./core/backend
    container_name: sg-core-backend
    # Lets the container reach gate consoles running on the host during
    # development. On Linux this name only resolves with the mapping below.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CORE_API_PORT:-8000}:8000"
    environment:
      - PORT=8000
      # No sweep in dev: it mutates device status on a timer, which is noise
      # when you are poking at a single gate by hand.
      - DISABLE_EDGE_SWEEP=true
      # Gate consoles the development reset button also clears. Each device owns
      # its own database, so clearing only the centre leaves the gates holding
      # readings the centre no longer has.
      - DEV_GATE_RESET_URLS=${DEV_GATE_RESET_URLS:-}
      # The centre's address AS A GATE DEVICE must dial it. Display-only on the
      # dashboard, so a technician can copy it into the device's .env -- the
      # device needs this value before it can reach the centre at all.
      - SMART_GATE_CORE_PUBLIC_URL=${SMART_GATE_CORE_PUBLIC_URL:-http://localhost:8000}
      # Backups run unattended every six hours. Set true only where they are
      # handled outside the app (managed database, volume snapshots).
      - SMART_GATE_DISABLE_BACKUP=${SMART_GATE_DISABLE_BACKUP:-false}
    volumes:
      - ./core/backend/data:/app/data
      - ./core/backend/ai-model:/app/ai-model
      - ./core/backend/sources:/app/sources
    restart: unless-stopped

  core-frontend:
    build:
      context: ./core/frontend
      dockerfile: Dockerfile
      args:
        # Baked at build time -- Next.js resolves rewrites during the build, so
        # setting this only at runtime has no effect.
        BACKEND_ORIGIN: http://core-backend:8000
    container_name: sg-core-frontend
    ports:
      - "${CORE_UI_PORT:-3000}:3000"
    depends_on:
      - core-backend
    restart: unless-stopped

  # --- Edge: one gate. In production this pair is what ships to a Jetson. ----
  edge-backend:
    build:
      context: ./edge/backend
    container_name: sg-edge-backend
    ports:
      - "${EDGE_API_PORT:-8100}:8100"
    environment:
      - SMART_GATE_CAMERA_CODE=${EDGE_CAMERA_CODE:-CAM-GATE-A}
      - SMART_GATE_INDUK_URL=http://core-backend:8000
      - SMART_GATE_API_KEY=${EDGE_API_KEY:-dev-api-key}
      - SMART_GATE_EDGE_DB=/srv/data/edge.db
      # Detection needs a camera, a GPU and the model; none of which exist in a
      # dev container. The API, the master replica and local matching all work
      # without it, which is the part worth exercising here.
      - SMART_GATE_RUN_AGENT=${EDGE_RUN_AGENT:-false}
      # Rekaman contoh ikut ditawarkan di tombol Jalankan Uji.
      - SMART_GATE_SAMPLE_CLIP_DIR=/srv/sample-videos
      - SMART_GATE_RTSP_URL=${EDGE_RTSP_URL:-rtsp://localhost:554/live}
    volumes:
      - ./edge/backend/data:/srv/data
      # Test clips for the OCR Inspection HUD. Mounted rather than baked into
      # the image: they are gate footage, not code, and a real device gets them
      # from its own camera.
      - ./edge/backend/video-sources:/srv/video-sources:ro
      # Read-only: pos tidak boleh menulis ke folder contoh.
      - ./docs/sample-references/sample-video/sample-videos:/srv/sample-videos:ro
    depends_on:
      - core-backend
    restart: unless-stopped

  edge-frontend:
    build:
      context: ./edge/frontend
      args:
        # Baked at build time, like the core UI's -- Next.js resolves rewrites
        # during the build, so a runtime env var here would have no effect.
        EDGE_BACKEND_ORIGIN: http://edge-backend:8100
    container_name: sg-edge-frontend
    ports:
      - "${EDGE_UI_PORT:-3100}:3100"
    depends_on:
      - edge-backend
    restart: unless-stopped
