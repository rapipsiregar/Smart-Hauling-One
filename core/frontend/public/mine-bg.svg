<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0c11"/>
      <stop offset="45%" stop-color="#0d1017"/>
      <stop offset="72%" stop-color="#171310"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </linearGradient>
    <radialGradient id="glow" cx="68%" cy="82%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.42"/>
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#7c3f06" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="terrace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#haze)"/>

  <!-- distant ridge line -->
  <path d="M0 470 L180 440 L360 465 L560 430 L760 458 L980 425 L1200 452 L1420 428 L1600 450 L1600 1000 L0 1000 Z"
        fill="#10131b" opacity="0.9"/>

  <!-- open-pit terraces (concentric benches) -->
  <g fill="url(#terrace)">
    <path d="M0 560 L1600 560 L1600 620 L0 620 Z" opacity="0.55"/>
    <path d="M120 630 L1480 630 L1360 690 L240 690 Z" opacity="0.6"/>
    <path d="M240 700 L1360 700 L1230 760 L370 760 Z" opacity="0.66"/>
    <path d="M370 770 L1230 770 L1090 832 L510 832 Z" opacity="0.72"/>
    <path d="M510 842 L1090 842 L960 902 L640 902 Z" opacity="0.8"/>
    <path d="M640 912 L960 912 L860 972 L740 972 Z" opacity="0.88"/>
  </g>

  <!-- bench edge highlights (orange rim light) -->
  <g stroke="#f59e0b" stroke-opacity="0.12" stroke-width="2" fill="none">
    <path d="M120 630 L1480 630"/>
    <path d="M240 700 L1360 700"/>
    <path d="M370 770 L1230 770"/>
    <path d="M510 842 L1090 842"/>
  </g>

  <!-- haul road switchbacks -->
  <g stroke="#3a3226" stroke-width="6" fill="none" stroke-opacity="0.7">
    <path d="M200 620 L640 690 L500 760 L840 832"/>
  </g>

  <rect width="1600" height="1000" fill="url(#glow)"/>
</svg>
