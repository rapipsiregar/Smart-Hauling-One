<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Smart Gate mark: a haul truck silhouette under a gate arch.
       Palette matches docs/design_system.md §3.1 (charcoal bg, amber accent). -->
  <rect width="32" height="32" rx="6" fill="#1A1D27"/>
  <!-- gate posts + lintel -->
  <path d="M6 22V11a10 10 0 0 1 20 0v11" fill="none" stroke="#F59E0B" stroke-width="2.2"
        stroke-linecap="round"/>
  <!-- haul truck: dump body + cab -->
  <path d="M9 22h8.5l1.5-4h-8z" fill="#F1F5F9"/>
  <path d="M19.5 22h4.5v-3.2h-3z" fill="#94A3B8"/>
  <!-- wheels -->
  <circle cx="12.5" cy="24" r="2.1" fill="#F1F5F9"/>
  <circle cx="21.5" cy="24" r="2.1" fill="#94A3B8"/>
</svg>
